name: build-feed

# Regenerate the pilot feed on a schedule and commit it. Vercel is connected to
# this repo, so each commit to public/ triggers a redeploy -- no Vercel token
# needed here. The generator is stdlib-only, so there is nothing to install.

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours (GitHub may delay/skip under load)
  workflow_dispatch:         # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # The article archive is Postgres (Neon), the source of truth for every
    # script. Add the pooled connection string as the DATABASE_URL repo secret
    # (Settings -> Secrets and variables -> Actions).
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (for text archiving)
        run: pip install -r requirements.txt

      # Dedup ON in CI: the cron runs every ~30 min, so without it the archive
      # (the permanent dedup state, now in Postgres) would re-append every
      # still-current article on each run. --days 7 is the Google fetch depth
      # (keeps us under Google News' ~100-result cap); the dashboard's display
      # window is separate (--window-days, default 14).
      - name: Build feed
        run: python build_feed.py --days 7 --delay 2.0 --dedup

      - name: Archive article text (incremental)
        run: python archive_text.py --limit 8 --delay 3

      # Resolve a batch of Google News redirect links to direct publisher URLs
      # (best-effort, resumable; writes resolved_url back into the archive).
      - name: Resolve redirect links (incremental)
        run: python resolve_links.py --limit 50 --workers 6

      - name: Refresh outputs with archive data
        run: python build_feed.py --days 7 --no-crawl --dedup

      - name: Commit refreshed feed + text snapshots
        run: |
          git config user.name  "scsdi-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The article archive (dedup state) now lives in Postgres, so it is no
          # longer committed. We still commit public/ (triggers the Vercel
          # redeploy), the extracted body snapshots under archive/text/, and the
          # per-run reports.
          git add public/ archive/text/ reports/
          if git diff --quiet --cached; then
            echo "No changes."
          else
            git commit -m "feed: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

name: build-feed

# Regenerate the pilot feed on a schedule and commit it. Vercel is connected to
# this repo, so each commit to public/ triggers a redeploy -- no Vercel token
# needed here. The generator is stdlib-only, so there is nothing to install.

on:
  schedule:
    - cron: "*/30 * * * *"  # every 30 min (GitHub may delay/skip under load)
  workflow_dispatch:         # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps (for text archiving)
        run: pip install -r requirements.txt

      # Dedup ON in CI: the cron runs every ~30 min, so without it the archive
      # (the permanent dedup state) would re-append every still-current article
      # on each run. --days 7 is the Google fetch depth (keeps us under Google
      # News' ~100-result cap); the dashboard's display window is separate
      # (--window-days, default 14).
      - name: Build feed
        run: python build_feed.py --days 7 --delay 2.0 --dedup

      - name: Archive article text (incremental)
        run: python archive_text.py --limit 8 --delay 3

      # Resolve a batch of Google News redirect links to direct publisher URLs
      # (best-effort, resumable; writes resolved_url back into the archive).
      - name: Resolve redirect links (incremental)
        run: python resolve_links.py --limit 50 --workers 6

      - name: Refresh outputs with archive data
        run: python build_feed.py --days 7 --no-crawl --dedup

      - name: Commit refreshed feed + archive
        run: |
          git config user.name  "scsdi-feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # archive/ holds the persistent dedup state -- it MUST be committed or
          # every run would see all articles as new.
          git add public/ archive/ reports/
          if git diff --quiet --cached; then
            echo "No changes."
          else
            git commit -m "feed: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

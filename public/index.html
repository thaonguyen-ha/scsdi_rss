<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCSDI News Watch</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#15223b; --muted:#637089; --line:#e4e8ef;
    --accent:#1f5fb0; --accent-ink:#fff; --chip:#eef2f8; --shadow:0 1px 2px rgba(20,34,59,.06),0 4px 16px rgba(20,34,59,.05);
  }
  :root:not([data-theme="light"]){}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0e1420; --panel:#151d2c; --ink:#e8edf6; --muted:#93a0b8; --line:#243147;
      --accent:#5a9be6; --accent-ink:#06101f; --chip:#1d2838; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0e1420; --panel:#151d2c; --ink:#e8edf6; --muted:#93a0b8; --line:#243147;
    --accent:#5a9be6; --accent-ink:#06101f; --chip:#1d2838; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:24px 16px 72px}
  header h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
  header p{margin:0;color:var(--muted);font-size:13px}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 12px;margin-top:16px;border-bottom:1px solid var(--line)}
  .stats{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:20px;line-height:1.1}
  .stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  input[type=search],select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  input[type=search]{flex:1;min-width:180px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);color:var(--muted);cursor:pointer;user-select:none}
  .chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  ul{list-style:none;margin:16px 0 0;padding:0}
  li.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
  li.item a{color:var(--ink);text-decoration:none;font-weight:600}
  li.item a:hover{color:var(--accent);text-decoration:underline}
  .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}
  .cc{font-weight:700;font-size:11px;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  .theme{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);padding:8px 10px;cursor:pointer}
  footer{margin-top:28px;color:var(--muted);font-size:12px;text-align:center}
  code{background:var(--chip);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SCSDI — South China Sea News Watch</h1>
    <p>Keyword-matched articles from tracked outlets · <span id="gen">loading…</span></p>
  </header>

  <div class="bar">
    <div class="stats">
      <div class="stat"><b id="n-items">—</b><span>articles</span></div>
      <div class="stat"><b id="n-src">—</b><span>outlets</span></div>
      <div class="stat"><b id="n-win">—</b><span>day window</span></div>
      <div class="stat"><b id="n-shown">—</b><span>showing</span></div>
    </div>
    <div class="controls">
      <input id="q" type="search" placeholder="Search titles…" autocomplete="off">
      <select id="country"></select>
      <select id="sort">
        <option value="date">Newest first</option>
        <option value="outlet">By outlet</option>
      </select>
      <button class="theme" id="theme">◐ theme</button>
    </div>
    <div class="chips" id="chips"></div>
  </div>

  <ul id="list"></ul>
  <div class="empty" id="empty" hidden>No articles match.</div>

  <footer>
    Pilot feed · <a href="feed.xml">feed.xml</a> · <a href="feed.json">feed.json</a> ·
    links open via Google News redirect · auto-generated, do not treat as coded events
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const state = {items:[], country:"", q:"", sort:"date", cc:new Set()};

// theme toggle (per-viewer convenience only)
try{ const t=localStorage.getItem("scsdi-theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
$("#theme").onclick=()=>{
  const cur=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=cur;
  try{localStorage.setItem("scsdi-theme",cur);}catch(e){}
};

function fmtDate(s){ const d=new Date(s); return isNaN(d)?"":d.toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }

function render(){
  const list=$("#list"); list.innerHTML="";
  let items=state.items.filter(it=>{
    if(state.country && it.country!==state.country) return false;
    if(state.cc.size && !state.cc.has(it.country)) return false;
    if(state.q && !(it.title||"").toLowerCase().includes(state.q)) return false;
    return true;
  });
  if(state.sort==="date") items.sort((a,b)=>new Date(b.pubDate||0)-new Date(a.pubDate||0));
  else items.sort((a,b)=>(a.outlet||"").localeCompare(b.outlet||"")||new Date(b.pubDate||0)-new Date(a.pubDate||0));
  $("#n-shown").textContent=items.length;
  $("#empty").hidden=items.length>0;
  const frag=document.createDocumentFragment();
  for(const it of items.slice(0,400)){
    const li=document.createElement("li"); li.className="item";
    const a=document.createElement("a"); a.href=it.link; a.target="_blank"; a.rel="noopener noreferrer"; a.textContent=it.title;
    const meta=document.createElement("div"); meta.className="meta";
    meta.innerHTML=`<span class="cc">${it.country||"?"}</span> <span>${it.outlet||it.source_name||""}</span>`+
                   (it.pubDate?` · <span>${fmtDate(it.pubDate)}</span>`:"");
    li.append(a,meta); frag.append(li);
  }
  list.append(frag);
}

fetch("feed.json").then(r=>r.json()).then(d=>{
  state.items=d.items||[];
  $("#gen").textContent="generated "+new Date(d.generated).toLocaleString();
  $("#n-items").textContent=d.n_items ?? state.items.length;
  $("#n-src").textContent=d.n_sources ?? "—";
  $("#n-win").textContent=d.window_days ?? "—";
  const countries=[...new Set(state.items.map(i=>i.country))].sort();
  const sel=$("#country"); sel.innerHTML='<option value="">All countries</option>'+countries.map(c=>`<option>${c}</option>`).join("");
  const chips=$("#chips");
  countries.forEach(c=>{
    const n=state.items.filter(i=>i.country===c).length;
    const el=document.createElement("span"); el.className="chip"; el.textContent=`${c} ${n}`;
    el.onclick=()=>{ el.classList.toggle("on"); el.classList.contains("on")?state.cc.add(c):state.cc.delete(c); render(); };
    chips.append(el);
  });
  render();
}).catch(e=>{ $("#gen").textContent="could not load feed.json ("+e+")"; });

$("#q").oninput=e=>{state.q=e.target.value.toLowerCase().trim();render();};
$("#country").onchange=e=>{state.country=e.target.value;render();};
$("#sort").onchange=e=>{state.sort=e.target.value;render();};
</script>
</body>
</html>
